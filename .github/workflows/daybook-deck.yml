# Render each published Immigration Daybook edition's social deck into the
# editions bucket (news-ingester docs/EDITIONS.md), then post it.
#
# No schedule. news-ingester's UpcomingApi starts this workflow (workflow_dispatch,
# with `date`) the moment the desk publishes or broadcasts an edition; a failed
# start shows in the desk's reply, and calling the op again retries. Each run,
# deck-sync.mjs reads the bucket's public index and renders a deck only for a
# language whose social/{date}/{lang}/deck.json is missing or older than the
# index's revision. Slides go to social/{date}/{lang}/r{revision}/; the
# manifest goes last.
#
# David's order (2026-10-16): publish to the web as often as he likes (each
# publish re-renders the deck: the site and the slides are the preview), then
# broadcast (broadcast_edition writes editions/{date}/broadcast.json, and a
# deck posts only once that mark lists its language; until then the log says
# "rendered; waiting for broadcast"), then the email last, which the desk drafts
# from the posts' links in posted.json.
#
# Then three jobs:
#   render  renders, and lists the decks ready to post: current in the bucket, in
#           a posted language (English and Spanish by default), marked for
#           broadcast, with no posted.json yet. It logs what will post, as a dry
#           run with no credentials.
#   post    posts them, in the `social` environment: English, a few minutes'
#           pause, then Spanish, to the same accounts.
#   record  writes each posted.json into the bucket, so nothing posts twice.
#
# Manual runs: `date` picks one edition, `test` reads test/editions and writes
# test/social (the rehearsal mirror), `dry_run` renders without uploading, and
# `langs` picks which languages may post. A test run or a dry run never posts;
# it can at most log what would. The AWS role trusts only refs/heads/main of this repo,
# so a run from any other branch must be a dry run.
#
# Two manual runs for the first real post:
#   check      read-only: the Page, its Instagram account, the token's scopes, and
#              whether each platform can post. Runs alone, in the `social`
#              environment, because it needs the secrets; nothing is rendered or posted.
#   test_post  a REAL post of a test edition's deck to the live accounts, to be
#              deleted by hand: renders the test/ mirror for `date` (required),
#              posts with a caption that says it is a test, and records
#              test/social/{date}/{lang}/posted.json. It is an explicit manual
#              test, so the broadcast mark does not gate it. English only unless
#              `langs` says otherwise.

name: Daybook deck

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Empty: today and yesterday in Bogota. Required for test_post.'
        required: false
        type: string
      test:
        description: 'Use the test/ mirror (read test/editions, write test/social). Never posts.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Render, but upload and post nothing'
        required: false
        type: boolean
        default: false
      rerender:
        description: 'Redraw decks that are already current (after a design change). Never posts anything twice.'
        required: false
        type: boolean
        default: false
      langs:
        description: 'Languages whose decks may post, comma-separated. Empty: en,es (en for test_post).'
        required: false
        type: string
        default: ''
      check:
        description: 'Only check what the Meta credentials can do (read-only; nothing renders or posts)'
        required: false
        type: boolean
        default: false
      test_post:
        description: 'REAL post of the test edition for `date` to the live accounts, to delete by hand'
        required: false
        type: boolean
        default: false

# No workflow-wide concurrency: each job that needs a group has its own, so a
# slow post (the pause between languages, Instagram's container wait) never
# holds the next render behind it.

permissions:
  id-token: write # OIDC: assume the deck role
  contents: read

env:
  # news-ingester's deploy output daybookDeckRoleArn. Not a secret: the role
  # trusts only this repo's main branch through GitHub OIDC (subject
  # repo:recoveredfactory/recoveredfactory-site:ref:refs/heads/main), and may
  # only PutObject under social/* and test/social/* (no list, no delete).
  DECK_ROLE_ARN: arn:aws:iam::647111127395:role/DaybookDeckRenderRole-e04ebe5
  DAYBOOK_BUCKET: news-ingester-production-daybookeditionsbucket-bcneortr

jobs:
  check:
    if: ${{ inputs.check == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The secrets live in the `social` environment. It only reads.
    environment: social
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check the Meta credentials
        working-directory: apps/daybook
        env:
          # A system user token, when set, wins over the Page token (deck-post.mjs).
          DAYBOOK_META_SYSTEM_TOKEN: ${{ secrets.DAYBOOK_META_SYSTEM_TOKEN }}
          DAYBOOK_FB_PAGE_ID: ${{ secrets.DAYBOOK_FB_PAGE_ID }}
          DAYBOOK_META_PAGE_TOKEN: ${{ secrets.DAYBOOK_META_PAGE_TOKEN }}
          DAYBOOK_META_APP_SECRET: ${{ secrets.DAYBOOK_META_APP_SECRET }}
          DAYBOOK_META_APP_ID: ${{ secrets.DAYBOOK_META_APP_ID }}
          DAYBOOK_IG_USER_ID: ${{ secrets.DAYBOOK_IG_USER_ID }}
        run: node scripts/daybook/deck-post.mjs --check

  render:
    if: ${{ inputs.check != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daybook-deck
      cancel-in-progress: false
    outputs:
      postable: ${{ steps.sync.outputs.postable }}
    steps:
      - name: Inputs
        if: ${{ inputs.test_post == true && inputs.date == '' }}
        run: |
          echo "::error::test_post needs a date: the test edition to post."
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The deck scripts use Node built-ins only, so there is no install step.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: ImageMagick
        run: command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)

      # og.mjs looks for google-chrome, google-chrome-stable, then chromium; the
      # runner image ships Google Chrome as google-chrome.
      - name: Chrome
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          google-chrome --version || true
          # Ubuntu 24.04 can block the unprivileged user namespaces Chrome's
          # sandbox needs; headless Chrome then exits without a screenshot.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: AWS credentials
        if: ${{ inputs.dry_run != true }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.DECK_ROLE_ARN }}
          aws-region: us-east-1

      # A test post renders the test/ mirror, like a test run, and is offered for
      # posting without a broadcast mark (--test-post).
      - name: Render and upload
        id: sync
        working-directory: apps/daybook
        env:
          DATE: ${{ inputs.date }}
          TEST: ${{ inputs.test == true || inputs.test_post == true }}
          TEST_POST: ${{ inputs.test_post }}
          DRY_RUN: ${{ inputs.dry_run }}
          RERENDER: ${{ inputs.rerender }}
          LANGS: ${{ inputs.langs || (inputs.test_post && 'en' || 'en,es') }}
        run: |
          args=(--post-langs "$LANGS")
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$TEST" = "true" ]; then args+=(--test); fi
          if [ "$TEST_POST" = "true" ]; then args+=(--test-post); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$RERENDER" = "true" ]; then args+=(--rerender); fi
          node scripts/daybook/deck-sync.mjs "${args[@]}"

      # A log of what will post: from the public bucket, with no credentials and
      # no Graph call, the caption and slides per platform for each deck the post
      # job is about to take.
      - name: Log what will post
        if: ${{ steps.sync.outputs.postable != '' && steps.sync.outputs.postable != '[]' }}
        working-directory: apps/daybook
        env:
          POSTABLE: ${{ steps.sync.outputs.postable }}
          TEST: ${{ inputs.test }}
          TEST_POST: ${{ inputs.test_post }}
        run: |
          args=(--postable "$POSTABLE")
          if [ "$TEST_POST" = "true" ]; then args+=(--test-post); elif [ "$TEST" = "true" ]; then args+=(--test); fi
          node scripts/daybook/deck-post.mjs "${args[@]}"

  post:
    needs: render
    # A plain test run never posts; a test_post run does, from the test mirror.
    if: ${{ needs.render.outputs.postable != '' && needs.render.outputs.postable != '[]' && inputs.dry_run != true && (inputs.test_post == true || inputs.test != true) }}
    runs-on: ubuntu-latest
    # English, a three-minute pause, Spanish; Instagram's container wait is at
    # most five minutes a language.
    timeout-minutes: 30
    # The `social` environment holds the Meta credentials (meta-auth.mjs).
    # What gets here is already marked for broadcast (or is a test_post).
    environment: social
    concurrency:
      group: daybook-deck-post
      cancel-in-progress: false
    outputs:
      # A count, not the records: GitHub drops a job output that contains a
      # secret's value, and a Facebook post id embeds the Page id, which is
      # stored as a secret. That silently skipped the record job on the first
      # real post (run 38903051764). The records travel as an artifact instead.
      posted_count: ${{ steps.collect.outputs.posted_count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Post
        working-directory: apps/daybook
        env:
          POSTABLE: ${{ needs.render.outputs.postable }}
          TEST_POST: ${{ inputs.test_post }}
          # A Business Settings system user token, when set, wins over the Page
          # token: the Page token is derived from it at run time, and Instagram
          # publishes with it. Facebook Login for Business can't grant posting
          # permissions to a user token, so this is the route that posts.
          DAYBOOK_META_SYSTEM_TOKEN: ${{ secrets.DAYBOOK_META_SYSTEM_TOKEN }}
          DAYBOOK_FB_PAGE_ID: ${{ secrets.DAYBOOK_FB_PAGE_ID }}
          DAYBOOK_META_PAGE_TOKEN: ${{ secrets.DAYBOOK_META_PAGE_TOKEN }}
          DAYBOOK_META_APP_SECRET: ${{ secrets.DAYBOOK_META_APP_SECRET }}
          # With a system token and no id, the Page's own Instagram account is used.
          DAYBOOK_IG_USER_ID: ${{ secrets.DAYBOOK_IG_USER_ID }}
          # Threads joins here with its own token once its account exists.
        run: |
          args=(--postable "$POSTABLE" --confirm --record-dir posted)
          if [ "$TEST_POST" = "true" ]; then args+=(--test-post); fi
          node scripts/daybook/deck-post.mjs "${args[@]}"

      # Whatever posted, even if a later platform failed, goes to the record job
      # as an artifact, laid out by bucket path (social/… or, for a test post,
      # test/social/…). This job can't write to the bucket itself: in the
      # `social` environment its OIDC subject is repo:…:environment:social,
      # which the deck role does not trust.
      - name: Count posted.json
        id: collect
        if: always()
        working-directory: apps/daybook
        run: |
          n=$(find posted -name posted.json 2>/dev/null | wc -l | tr -d ' ')
          echo "posted_count=$n" >> "$GITHUB_OUTPUT"
          echo "posted.json files: $n"

      - name: Hand posted.json to the record job
        if: always() && steps.collect.outputs.posted_count != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: posted
          path: apps/daybook/posted/
          if-no-files-found: ignore
          retention-days: 7

  record:
    needs: post
    if: ${{ always() && needs.post.outputs.posted_count != '' && needs.post.outputs.posted_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No environment here, so the OIDC subject is this repo's main branch,
      # which the deck role trusts.
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.DECK_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch posted.json from the post job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: posted
          path: posted

      # Only a posted.json key, live or test, is ever written.
      - name: Write posted.json
        run: |
          KEY='^(test/)?social/[0-9]{4}-[0-9]{2}-[0-9]{2}/[a-z]{2}/posted\.json$'
          cd posted
          # A for loop, not a piped while: a pipe's subshell would swallow exit 1.
          for key in $(find . -name posted.json | sed 's|^\./||' | sort); do
            if ! echo "$key" | grep -Eq "$KEY"; then echo "refusing to write $key"; exit 1; fi
            aws s3 cp "$key" "s3://$DAYBOOK_BUCKET/$key" \
              --content-type application/json --cache-control 'public, max-age=60' --only-show-errors
            echo "$key written"
          done
