# Render each published Immigration Daybook edition's social deck into the
# editions bucket (news-ingester docs/EDITIONS.md), then post it.
#
# Every 15 minutes through the Bogota morning, deck-sync.mjs reads the bucket's
# public index and renders a deck only for a language whose
# social/{date}/{lang}/deck.json is missing or older than the index's revision.
# Most runs find nothing new and say so in the job summary. Slides go to
# social/{date}/{lang}/r{revision}/; the manifest goes last.
#
# Then three jobs:
#   render  renders, and lists the decks ready to post: current in the bucket, in
#           a posted language (English and Spanish by default), with no
#           posted.json yet. It previews each post as a dry run, with no credentials.
#   post    posts them, in the `social` environment: English, a few minutes'
#           pause, then Spanish, to the same accounts. David approves it.
#   record  writes each posted.json into the bucket, so nothing posts twice.
#
# Manual runs: `date` picks one edition, `test` reads test/editions and writes
# test/social (the rehearsal mirror), `dry_run` renders without uploading, and
# `langs` picks which languages may post. A test run or a dry run never posts;
# it can at most preview. The AWS role trusts only refs/heads/main of this repo,
# so a run from any other branch must be a dry run.
#
# Two manual runs for the first real post:
#   check      read-only: the Page, its Instagram account, the token's scopes, and
#              whether each platform can post. Runs alone, in the `social`
#              environment, because it needs the secrets; nothing is rendered or posted.
#   test_post  a REAL post of a test edition's deck to the live accounts, to be
#              deleted by hand: renders the test/ mirror for `date` (required),
#              posts with a caption that says it is a test (David approves, as
#              always), and records test/social/{date}/{lang}/posted.json. English
#              only unless `langs` says otherwise.

name: Daybook deck

on:
  schedule:
    # 10:00-17:45 UTC is 05:00-12:45 in Bogota, when editions lock.
    - cron: '*/15 10-17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Empty: today and yesterday in Bogota. Required for test_post.'
        required: false
        type: string
      test:
        description: 'Use the test/ mirror (read test/editions, write test/social). Never posts.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Render, but upload and post nothing'
        required: false
        type: boolean
        default: false
      langs:
        description: 'Languages whose decks may post, comma-separated. Empty: en,es (en for test_post).'
        required: false
        type: string
        default: ''
      check:
        description: 'Only check what the Meta credentials can do (read-only; nothing renders or posts)'
        required: false
        type: boolean
        default: false
      test_post:
        description: 'REAL post of the test edition for `date` to the live accounts, to delete by hand'
        required: false
        type: boolean
        default: false

# No workflow-wide concurrency: the post job can wait hours for David's
# approval, and a run-wide group would hold every render behind it. Each job
# that needs one has its own.

permissions:
  id-token: write # OIDC: assume the deck role
  contents: read

env:
  # news-ingester's deploy output daybookDeckRoleArn. Not a secret: the role
  # trusts only this repo's main branch through GitHub OIDC (subject
  # repo:recoveredfactory/recoveredfactory-site:ref:refs/heads/main), and may
  # only PutObject under social/* and test/social/* (no list, no delete).
  DECK_ROLE_ARN: arn:aws:iam::647111127395:role/DaybookDeckRenderRole-e04ebe5
  DAYBOOK_BUCKET: news-ingester-production-daybookeditionsbucket-bcneortr

jobs:
  check:
    if: ${{ inputs.check == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The secrets live in the `social` environment, so this asks for David's
    # approval like a post does. It only reads.
    environment: social
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check the Meta credentials
        working-directory: apps/daybook
        env:
          DAYBOOK_FB_PAGE_ID: ${{ secrets.DAYBOOK_FB_PAGE_ID }}
          DAYBOOK_META_PAGE_TOKEN: ${{ secrets.DAYBOOK_META_PAGE_TOKEN }}
          DAYBOOK_META_APP_SECRET: ${{ secrets.DAYBOOK_META_APP_SECRET }}
          DAYBOOK_META_APP_ID: ${{ secrets.DAYBOOK_META_APP_ID }}
          DAYBOOK_IG_USER_ID: ${{ secrets.DAYBOOK_IG_USER_ID }}
        run: node scripts/daybook/deck-post.mjs --check

  render:
    if: ${{ inputs.check != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daybook-deck
      cancel-in-progress: false
    outputs:
      postable: ${{ steps.sync.outputs.postable }}
    steps:
      - name: Inputs
        if: ${{ inputs.test_post == true && inputs.date == '' }}
        run: |
          echo "::error::test_post needs a date: the test edition to post."
          exit 1

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The deck scripts use Node built-ins only, so there is no install step.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: ImageMagick
        run: command -v magick || command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)

      # og.mjs looks for google-chrome, google-chrome-stable, then chromium; the
      # runner image ships Google Chrome as google-chrome.
      - name: Chrome
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          google-chrome --version || true
          # Ubuntu 24.04 can block the unprivileged user namespaces Chrome's
          # sandbox needs; headless Chrome then exits without a screenshot.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: AWS credentials
        if: ${{ inputs.dry_run != true }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.DECK_ROLE_ARN }}
          aws-region: us-east-1

      # A test post renders the test/ mirror, like a test run.
      - name: Render and upload
        id: sync
        working-directory: apps/daybook
        env:
          DATE: ${{ inputs.date }}
          TEST: ${{ inputs.test == true || inputs.test_post == true }}
          DRY_RUN: ${{ inputs.dry_run }}
          LANGS: ${{ inputs.langs || (inputs.test_post && 'en' || 'en,es') }}
        run: |
          args=(--post-langs "$LANGS")
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ "$TEST" = "true" ]; then args+=(--test); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/daybook/deck-sync.mjs "${args[@]}"

      # What the post job would post, from the public bucket, with no credentials
      # and no Graph call: the caption and slides per platform. This is what David
      # sees before he approves.
      - name: Preview the posts
        if: ${{ steps.sync.outputs.postable != '' && steps.sync.outputs.postable != '[]' }}
        working-directory: apps/daybook
        env:
          POSTABLE: ${{ steps.sync.outputs.postable }}
          TEST: ${{ inputs.test }}
          TEST_POST: ${{ inputs.test_post }}
        run: |
          args=(--postable "$POSTABLE")
          if [ "$TEST_POST" = "true" ]; then args+=(--test-post); elif [ "$TEST" = "true" ]; then args+=(--test); fi
          node scripts/daybook/deck-post.mjs "${args[@]}"

  post:
    needs: render
    # A plain test run never posts; a test_post run does, from the test mirror.
    if: ${{ needs.render.outputs.postable != '' && needs.render.outputs.postable != '[]' && inputs.dry_run != true && (inputs.test_post == true || inputs.test != true) }}
    runs-on: ubuntu-latest
    # English, a three-minute pause, Spanish; Instagram's container wait is at
    # most five minutes a language.
    timeout-minutes: 30
    # The `social` environment holds the Meta credentials (meta-auth.mjs), and
    # its required-reviewer rule is David's one-tap approval: this job waits
    # until he approves it. The rule is set in the repo's environment settings,
    # not here.
    environment: social
    concurrency:
      group: daybook-deck-post
      cancel-in-progress: false
    outputs:
      posted: ${{ steps.collect.outputs.posted }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Post
        working-directory: apps/daybook
        env:
          POSTABLE: ${{ needs.render.outputs.postable }}
          TEST_POST: ${{ inputs.test_post }}
          DAYBOOK_FB_PAGE_ID: ${{ secrets.DAYBOOK_FB_PAGE_ID }}
          DAYBOOK_META_PAGE_TOKEN: ${{ secrets.DAYBOOK_META_PAGE_TOKEN }}
          DAYBOOK_META_APP_SECRET: ${{ secrets.DAYBOOK_META_APP_SECRET }}
          # Absent until Instagram is linked; Instagram is skipped until then.
          DAYBOOK_IG_USER_ID: ${{ secrets.DAYBOOK_IG_USER_ID }}
          # Threads joins here with its own token once its account exists.
        run: |
          args=(--postable "$POSTABLE" --confirm --record-dir posted)
          if [ "$TEST_POST" = "true" ]; then args+=(--test-post); fi
          node scripts/daybook/deck-post.mjs "${args[@]}"

      # Whatever posted, even if a later platform failed, goes to the record job,
      # keyed by its bucket path (social/… or, for a test post, test/social/…).
      # This job can't write to the bucket itself: in the `social` environment
      # its OIDC subject is repo:…:environment:social, which the deck role does
      # not trust.
      - name: Hand posted.json to the record job
        id: collect
        if: always()
        working-directory: apps/daybook
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const out = {};
            const walk = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name === "posted.json") out[path.relative("posted", full)] = JSON.parse(fs.readFileSync(full, "utf8"));
              }
            };
            if (fs.existsSync("posted")) walk("posted");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `posted=${JSON.stringify(out)}\n`);
            console.log(`posted.json for: ${Object.keys(out).join(", ") || "nothing"}`);
          '

  record:
    needs: post
    if: ${{ always() && needs.post.outputs.posted != '' && needs.post.outputs.posted != '{}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No environment here, so the OIDC subject is this repo's main branch,
      # which the deck role trusts.
      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.DECK_ROLE_ARN }}
          aws-region: us-east-1

      # Only a posted.json key, live or test, is ever written.
      - name: Write posted.json
        env:
          POSTED: ${{ needs.post.outputs.posted }}
        run: |
          node -e '
            const fs = require("fs");
            const KEY = /^(test\/)?social\/\d{4}-\d{2}-\d{2}\/[a-z]{2}\/posted\.json$/;
            let n = 0;
            for (const [key, posted] of Object.entries(JSON.parse(process.env.POSTED))) {
              if (!KEY.test(key)) throw new Error(`refusing to write ${key}`);
              fs.writeFileSync(`${process.env.RUNNER_TEMP}/posted-${n}.json`, JSON.stringify(posted, null, 2));
              console.log(`${n} ${key}`);
              n += 1;
            }
          ' > "$RUNNER_TEMP/posted.txt"
          while read -r n key; do
            aws s3 cp "$RUNNER_TEMP/posted-$n.json" "s3://$DAYBOOK_BUCKET/$key" \
              --content-type application/json --cache-control 'public, max-age=60' --only-show-errors
            echo "$key written"
          done < "$RUNNER_TEMP/posted.txt"
