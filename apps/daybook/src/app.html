<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Same umami site as recoveredfactory.net for now; umami records the
         hostname on every event, so the two domains can be told apart in the
         dashboard. Give the Daybook its own website id there when it wants
         its own dashboard. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="d70c5b0a-eec2-4628-9481-639be45bd0a6"
    ></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
